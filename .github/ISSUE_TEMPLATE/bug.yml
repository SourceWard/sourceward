name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction.
    validations:
      required: true
  - type: input
    attributes:
      label: SourceWard version
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Security impact
      options:
        - None known
        - Possibly security-related
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities here. Use private vulnerability reporting.
