name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check
      - run: go vet ./...
      - run: go test -race ./...
      - run: make test-e2e
      - run: go build ./cmd/sourceward
