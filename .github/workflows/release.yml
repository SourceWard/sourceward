name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
          do
            os=${target%/*}
            arch=${target#*/}
            suffix=
            if [ "$os" = windows ]; then suffix=.exe; fi
            output="dist/sourceward_${VERSION#v}_${os}_${arch}${suffix}"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X github.com/SourceWard/sourceward/internal/cli.Version=$VERSION" \
              -o "$output" ./cmd/sourceward
          done
          (cd dist && sha256sum sourceward_* > checksums.txt)
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
