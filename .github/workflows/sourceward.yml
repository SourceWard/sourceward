name: SourceWard

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate SourceWard SARIF
        run: go run ./cmd/sourceward audit --format sarif --fail-on none > sourceward.sarif
      - name: Upload SourceWard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sourceward.sarif
          category: sourceward
