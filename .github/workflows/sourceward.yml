name: SourceWard

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate SourceWard SARIF
        run: go run ./cmd/sourceward scan --format sarif --fail-on none > sourceward.sarif
      - name: Upload SourceWard SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@311b4ee155dcdab395044f00946f664bd51ff173
        with:
          sarif_file: sourceward.sarif
          category: sourceward
